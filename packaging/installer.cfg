[Application]
name=LandlabGUI
version=2.2.1
publisher=LandlabGUI
entry_point=main:main
console=false
license_file=../LICENSE
extra_preamble=win_path_preamble.py

[Python]
version=3.12.10
bitness=64
include_msvcrt=true

[Include]
local_wheels=wheels/*.whl
files=../main.py
    ../app
    ../plugins
    ../presets
    ../docs
    ../README.md
    ../requirements.txt
    ../LICENSE
exclude=__pycache__
    *.pyc
    *.pyo

[Build]
directory=../build/pynsist
installer_name=LandlabGUI-2.2.1-win64-setup.exe
nsi_template=landlabgui.nsi
